[project]
name = "hcltech-ai-hackathon"
version = "0.1.0"
description = "Enterprise Documentation Q&A Assistant - grounded RAG with citations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["llm: tests that call a real LLM API (skipped by default)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]  # long lines tolerated in tests/mocks; keep (str, Enum) for readability
